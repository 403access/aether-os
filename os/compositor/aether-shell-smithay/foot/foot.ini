# Aether terminal — Water theme.
#
# Loaded by the aether-terminal wrapper (foot -c) and by the Xvfb smokes via
# XDG_CONFIG_HOME. Keep colours in sync with packages/design-system/tokens.css.

[main]
font=DejaVu Sans Mono:size=11
# The compositor draws the 34 px Aether title bar, so foot only needs an even
# inner pad around its grid.
pad=12x12
selection-target=primary

[scrollback]
lines=10000

[cursor]
style=beam

[colors-dark]
alpha=1.0
cursor=38D6FF 031922
background=031922
foreground=E9FBFF
selection-foreground=031922
selection-background=38D6FF
