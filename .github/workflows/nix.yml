name: nix

# Manual only until P1: the flake targets a specific machine and evaluating it
# in CI is not the same as building it. Run this on a Linux host with Nix.
on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate the flake
        run: nix flake check ./os/nixos --no-build
