name: smithay-full

# Nightly/manual full smoke sweep. PRs run the curated set in smithay.yml.
on:
  schedule:
    - cron: "42 5 * * *"
  workflow_dispatch:

jobs:
  full-suite:
    name: full Xvfb smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Full smoke suite
        run: |
          # shellcheck disable=SC2016  # ${smoke} expands in the nested bash -lc
          nix develop .#smithay --command bash -lc '
            set -uo pipefail
            BIN=os/compositor/aether-shell-smithay/target/debug/aether-shell-smithay
            failed=""
            for smoke in os/compositor/aether-shell-smithay/smoke-*.sh; do
              echo "=== ${smoke}"
              # Report every broken smoke from one nightly run.
              if ! BIN="${BIN}" "${smoke}"; then
                failed="${failed} ${smoke}"
              fi
            done
            if [ -n "${failed}" ]; then
              echo "FAILED smokes:${failed}"
              exit 1
            fi
            echo "full smoke suite passed"
          '
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smithay-full
          path: artifacts/
          retention-days: 14
