name: smithay

# Linux-only compositor backends. PRs touching the compositor build and test all
# three manifests and run a curated Xvfb smoke set. The full 23-smoke suite runs
# nightly; the remaining smokes are manual via workflow_dispatch.
on:
  pull_request:
    paths:
      - "os/compositor/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/smithay.yml"
  push:
    branches: [main]
    paths:
      - "os/compositor/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/smithay.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  build-and-present:
    name: build + test + Xvfb smokes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and clippy all backends
        run: |
          # shellcheck disable=SC2016  # $crate expands in the nested bash -lc
          nix develop .#smithay --command bash -lc '
            set -euo pipefail
            for crate in aether-shell-wayland aether-shell-smithay aether-shell-drm; do
              cargo fmt --manifest-path os/compositor/$crate/Cargo.toml -- --check
              cargo clippy --manifest-path os/compositor/$crate/Cargo.toml -- -D warnings
              cargo build --manifest-path os/compositor/$crate/Cargo.toml
            done
          '
      - name: Test standalone backends
        run: |
          # shellcheck disable=SC2016  # $crate expands in the nested bash -lc
          nix develop .#smithay --command bash -lc '
            set -euo pipefail
            cargo test --manifest-path os/compositor/aether-shell-wayland/Cargo.toml
            cargo test --manifest-path os/compositor/aether-shell-drm/Cargo.toml
          '
      - name: Curated presentation smokes
        run: |
          # shellcheck disable=SC2016  # ${smoke} expands in the nested bash -lc
          nix develop .#smithay --command bash -lc '
            set -uo pipefail
            BIN=os/compositor/aether-shell-smithay/target/debug/aether-shell-smithay
            failed=""
            for smoke in \
              smoke-damage-xvfb.sh \
              smoke-idle-xvfb.sh \
              smoke-cursor-xvfb.sh \
              smoke-palette-xvfb.sh \
              smoke-explorer-xvfb.sh \
              smoke-chat-xvfb.sh \
              smoke-focus-xvfb.sh \
              smoke-fullscreen-xvfb.sh \
              smoke-provider-xvfb.sh \
              smoke-index-xvfb.sh \
              smoke-index-slow-xvfb.sh \
              smoke-text-input-xvfb.sh \
              smoke-agent-ipc-xvfb.sh \
              smoke-clipboard-persist-xvfb.sh \
              smoke-actions-xvfb.sh \
              smoke-audio-xvfb.sh \
              smoke-shortcuts-xvfb.sh \
              smoke-topbar-xvfb.sh \
              smoke-task-manager-xvfb.sh; do
                echo "=== ${smoke}"
                # Run the whole set: one push should report every broken smoke
                # instead of stopping at the first and hiding the rest.
                if ! BIN="${BIN}" "./os/compositor/aether-shell-smithay/${smoke}"; then
                  failed="${failed} ${smoke}"
                fi
            done
            if [ -n "${failed}" ]; then
              echo "FAILED smokes:${failed}"
              exit 1
            fi
            echo "all curated smokes passed"
          '
      - name: Frame stats summary
        if: always()
        run: |
          if [ -f artifacts/perf/p2/frames.ndjson ]; then
            python3 scripts/frame-stats.py artifacts/perf/p2/frames.ndjson
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smithay-window
          path: artifacts/
          retention-days: 14
