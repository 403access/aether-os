[package]
name = "aether-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kernel-enforced agent sandbox: Landlock, seccomp, UID and cgroup limits"

[lib]
name = "aether_sandbox"
path = "src/lib.rs"

[[bin]]
name = "aether-sandbox"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
