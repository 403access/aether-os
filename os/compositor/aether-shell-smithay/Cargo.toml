[package]
name = "aether-shell-smithay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Linux-only Smithay winit backend for the Aether shell (development adapter)"

# Standalone: never part of the default workspace, so macOS/CI do not try to
# build Smithay. Build with --manifest-path on Linux.
[workspace]

[[bin]]
name = "aether-shell-smithay"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "wayland_frontend"] }
aether-cursor = { path = "../crates/aether-cursor" }
aether-geometry = { path = "../crates/aether-geometry" }
aether-layout = { path = "../crates/aether-layout" }
aether-scene = { path = "../crates/aether-scene" }
aether-shell = { path = "../crates/aether-shell" }
aether-shell-wayland = { path = "../aether-shell-wayland" }
