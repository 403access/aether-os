name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit and DOM tests
        run: bun run test:unit
      - name: Build site and docs
        run: bun run build

  rust:
    name: compositor core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --manifest-path os/compositor/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path os/compositor/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path os/compositor/Cargo.toml

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: End-to-end
        run: bun run test:e2e

  bench:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      # The committed baseline was recorded on a faster host. CI uses a 3x
      # tolerance as an order-of-magnitude smoke test. The exact 25% gate runs
      # on the reference machine (see docs/ops/build-and-release).
      - name: Benchmarks
        run: bun run packages/bench/src/cli.ts --check --tolerance=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results/
          retention-days: 14
