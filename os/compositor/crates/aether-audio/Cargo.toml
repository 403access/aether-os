[package]
name = "aether-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PipeWire route policy, latency presets and audio overlay state for Aether"

[lib]
name = "aether_audio"
path = "src/lib.rs"

[[bin]]
name = "aether-audio"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
