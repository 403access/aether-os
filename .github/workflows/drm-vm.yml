name: drm-vm

# Headless native-backend smoke. Requires an arm64 Linux runner with KVM (or
# TCG) and virtiofsd; GitHub-hosted x86_64 runners cannot build the aarch64 VM.
# Keep this manual/nightly with a labelled self-hosted runner.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

jobs:
  native-drm:
    name: virtio-gpu DRM smoke
    runs-on: [self-hosted, linux, arm64, kvm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and boot the VM with virtio-gpu
        run: |
          ./scripts/vm-drm-tcg.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drm-vm-evidence
          path: artifacts/vm-drm/
