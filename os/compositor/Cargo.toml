[workspace]
members = [
  "crates/aether-geometry",
  "crates/aether-protocol",
  "crates/aether-damage",
  "crates/aether-layout",
  "crates/aether-pacing",
  "crates/aether-scene",
  "crates/aether-cache",
  "crates/aether-compositor",
  "crates/aether-shell",
  "crates/aether-text",
  "crates/aether-desktop",
  "crates/aether-files",
  "crates/aether-cursor",
  "crates/aether-audio",
  "crates/aether-sandbox",
  "crates/aether-system",
  "crates/aether-preview",
  "crates/aether-remote",
  "crates/aether-mcp",
  "crates/aether-chat",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
aether-geometry = { path = "crates/aether-geometry" }
aether-protocol = { path = "crates/aether-protocol" }
aether-damage = { path = "crates/aether-damage" }
aether-layout = { path = "crates/aether-layout" }
aether-pacing = { path = "crates/aether-pacing" }
aether-scene = { path = "crates/aether-scene" }
aether-shell = { path = "crates/aether-shell" }
aether-text = { path = "crates/aether-text" }
aether-audio = { path = "crates/aether-audio" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
