name: smithay

# Linux-only backend. Kept manual because it needs EGL/X11/Xvfb; the default CI
# remains toolkit-free. Run this workflow when touching the backend or Smithay.
on:
  workflow_dispatch:

jobs:
  build-and-present:
    name: build + Xvfb presentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build backend
        run: |
          nix develop .#smithay --command \
            cargo build --manifest-path os/compositor/aether-shell-smithay/Cargo.toml
      - name: Clippy and format
        run: |
          nix develop .#smithay --command bash -lc '
            cargo fmt --manifest-path os/compositor/aether-shell-smithay/Cargo.toml -- --check
            cargo clippy --manifest-path os/compositor/aether-shell-smithay/Cargo.toml -- -D warnings
          '
      - name: Present the FramePlan demo under Xvfb
        run: |
          nix develop .#smithay --command \
            ./os/compositor/aether-shell-smithay/smoke-xvfb.sh
      - name: Render a real Wayland client under Xvfb
        run: |
          nix develop .#smithay --command \
            ./os/compositor/aether-shell-smithay/smoke-client-xvfb.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smithay-window
          path: artifacts/smithay/
          retention-days: 14
